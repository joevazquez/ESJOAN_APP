name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probar:
    name: Probar motor del simulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/simulador.test.mjs

  publicar:
    name: Publicar sitio
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que js/config.js ya tiene tus datos de Supabase
        run: |
          if grep -q "TU-PROYECTO\|TU-LLAVE" js/config.js; then
            echo "::error file=js/config.js::Falta pegar la URL y la llave anon de Supabase en js/config.js"
            exit 1
          fi

      - name: Armar el sitio (solo archivos públicos; sin SQL ni pruebas)
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
